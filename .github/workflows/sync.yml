name: Sync Salesmate Companies Daily

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run Salesmate sync
        env:
          SALESMATE_ACCESS_KEY: ${{ secrets.SALESMATE_ACCESS_KEY }}
          SALESMATE_SECRET_KEY: ${{ secrets.SALESMATE_SECRET_KEY }}
        run: node salesmate_fetch.js
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add salesmate_companies_*.json
          git commit -m "Sync Salesmate companies $(date +%Y-%m-%d)" || echo "No changes"
          git push
